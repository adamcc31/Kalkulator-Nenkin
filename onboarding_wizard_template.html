<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kalkulator Nenkin - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FF5400", 
              "primary-hover": "#e04800",
              "background-light": "#FFF5F5", 
              "background-dark": "#0F172A", 
              "card-light": "#FFFFFF",
              "card-dark": "#1E293B",
              "text-light": "#1e293b", 
              "text-dark": "#f8fafc", 
              "subtext-light": "#64748b",
              "subtext-dark": "#94a3b8",
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem", 
              'xl': "1rem",      
              '2xl': "1.5rem",   
            },
          },
        },
      };
    </script>
<style>
        .auth-gradient {
            background: linear-gradient(180deg, #0F172A 0%, #0F172A 40%, #000000 100%);
            position: relative;
            overflow: hidden;
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }.no-scrollbar {
            -ms-overflow-style: none;scrollbar-width: none;}
    </style>
</head>
<body class="font-sans bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark min-h-screen flex items-center justify-center p-4 selection:bg-primary selection:text-white transition-colors duration-300">
<div class="w-full max-w-[600px] bg-card-light dark:bg-card-dark rounded-2xl shadow-2xl overflow-hidden flex flex-col transition-colors duration-300 ring-1 ring-slate-900/5 dark:ring-white/10 relative">
<button class="absolute top-6 right-6 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400 z-10" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
<div class="pt-8 px-8 md:px-12 pb-2">
<div class="flex items-center justify-center space-x-2 mb-6">
<span class="material-symbols-outlined text-primary text-3xl">calculate</span>
<span class="font-bold text-lg tracking-wide text-slate-900 dark:text-white">EXATA INDONESIA</span>
</div>
<div class="text-center">
<h2 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white mb-2">Informasi Dasar</h2>
<p class="text-subtext-light dark:text-subtext-dark text-sm md:text-base">Lengkapi data diri Anda untuk memulai estimasi.</p>
</div>
</div>
<div class="p-8 md:px-12 md:pb-12 pt-4">
<form action="#" class="space-y-5" method="POST">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="fullname">Nama Lengkap</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400">person</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all dark:text-white placeholder-slate-400" id="fullname" name="fullname" placeholder="Contoh: Budi Santoso" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="return_date">Estimasi Kepulangan</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400">calendar_month</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all dark:text-white placeholder-slate-400 appearance-none" id="return_date" name="return_date" required="" type="month"/>
</div>
<p class="text-xs text-slate-500 mt-1">Bulan dan tahun rencana pulang ke Indonesia</p>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="whatsapp">Nomor Whatsapp Aktif</label>
<div class="flex">
<span class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 sm:text-sm font-medium">
                            +62
                        </span>
<input class="w-full px-4 py-3 rounded-r-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all dark:text-white placeholder-slate-400" id="whatsapp" name="whatsapp" placeholder="81234567890" required="" type="tel"/>
</div>
</div>
<div>
<div class="flex justify-between">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5" for="lpk">LPK (Lembaga Pelatihan Kerja)</label>
<span class="text-xs text-slate-400 italic mt-0.5">Opsional</span>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400">business</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all dark:text-white placeholder-slate-400" id="lpk" name="lpk" placeholder="Nama LPK Pengirim" type="text"/>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/30 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2 group" type="submit">
<span>Selanjutnya</span>
<span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="w-full mt-3 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 text-sm font-medium py-2 transition-colors" type="button">
                        Kembali ke Login
                    </button>
</div>
</form>
</div>
</div>
</body></html>
